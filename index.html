<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>무역영어 1급 CBT · 기출문제은행</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#143B70">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="무역영어 CBT">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
<header class="topbar">
 <div class="topbar-inner">
  <a href="#" class="brand" data-action="home" aria-label="대시보드로 이동"><span class="brand-mark">TE</span><span><strong>무역영어 CBT</strong><small>1급 · 2015—2020 기출</small></span></a>
  <nav aria-label="메인 메뉴">
   <button type="button" data-action="home" id="nav-home">시험 선택</button>
   <button type="button" data-action="review" id="nav-review">원본 검수</button>
   <button type="button" data-action="export-patch" class="nav-export">검수자료 내보내기</button>
  </nav>
 </div>
</header>
<main id="app"><div class="loading">문제은행을 불러오는 중입니다…</div></main>
<input type="file" id="patchImport" accept=".json,application/json" class="visually-hidden" aria-label="검수 수정 자료 JSON 불러오기">
<input type="file" id="progressImport" accept=".json,application/json" class="visually-hidden" aria-label="시험 풀이 기록 JSON 불러오기"><div id="toast" role="status" aria-live="polite"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js", {scope:"./"}).catch(err => console.warn("PWA offline unavailable", err)));
}
</script>
</body>
</html>
